[pytest]
# Pytest configuration for CamouSolverr

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests that use real browser (deselect with '-m "not integration"')
    unit: marks tests as unit tests (fast, no browser)
    performance: marks tests as performance tests

# Output options
addopts =
    -v
    -s
    --tb=long
    --strict-markers
    -ra
    --showlocals
    --capture=no

# Logging
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = test_logs.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=term-missing --cov-report=html

# Timeouts
# Integration tests can take longer (browser operations need more time)
timeout = 600
timeout_method = thread

# Parallel execution (if pytest-xdist is installed)
# Uncomment to enable parallel test execution
# addopts = -n auto
