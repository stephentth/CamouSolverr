  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare variables
        id: vars
        run: |
          SURFIX=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          echo "SURFIX=$SURFIX" >> $GITHUB_OUTPUT
          # Use shared tag with platform suffix for intermediate images
          echo "LOCAL_TAG=${{ needs.prepare.outputs.tag }}-$SURFIX" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up BuildKit Docker container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into registry
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: type=raw,value=${{ steps.vars.outputs.LOCAL_TAG }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image for each platform
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            GITHUB_BUILD=true
            VERSION=${{ github.ref_name }}

  merge-and-push:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install the cosign tool
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into registry
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create manifest lists and push
      - name: Create and push manifest lists
        run: |
          image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image=${image,,}

          TAG="${{ needs.prepare.outputs.tag }}"

          echo "Creating multi-arch manifest for tag: $TAG"

          # Create manifest with the timestamp-sha tag and latest
          docker buildx imagetools create \
            -t ${image}:${TAG} \
            -t ${image}:latest \
            ${image}:${TAG}-amd64 \
            ${image}:${TAG}-arm64

      # Sign the manifests
      - name: Sign the manifests
        run: |
          image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image=${image,,}
          TAG="${{ needs.prepare.outputs.tag }}"

          cosign sign --yes ${image}:${TAG}
          cosign sign --yes ${image}:latest
